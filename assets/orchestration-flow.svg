  </g>
  <circle cx="32" cy="32" r="14" fill="#F3B43B" />
</g><text x="640" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#DFE6F1">Sol 6.1</text></g>
<g id="node-reviewer" aria-label="optional independent review"><rect x="850" y="240" width="100" height="100" rx="18" fill="#FFFFFF"/><g transform="translate(868 258)"><path d="M32 5C37 24 40 27 59 32C40 37 37 40 32 59C27 40 24 37 5 32C24 27 27 24 32 5Z" fill="#8970C7" />
</g><text x="900" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#DFE6F1">Astra</text></g>
<g id="node-final" aria-label="final checks"><rect x="1110" y="240" width="100" height="100" rx="18" fill="#FFFFFF"/><g transform="translate(1128 258)"><g stroke="#ECA526" stroke-width="4" stroke-linecap="round">
    <path d="M32 5V11M32 53V59M5 32H11M53 32H59M13 13L17 17M47 47L51 51M13 51L17 47M47 17L51 13" />
  </g>
  <circle cx="32" cy="32" r="14" fill="#F3B43B" />
</g><text x="1160" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#DFE6F1">Sol 6.1</text></g>
</svg>
